name: ${COMPOSE_PROJECT_NAME:-waifu-api-selfhosted}
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        VERSION: ${IMAGE_TAG}
    image: waifu-api-backend:${IMAGE_TAG}
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=${POSTGRES_HOST};Port=${POSTGRES_PORT};Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${BACKEND_PORT}:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: waifu-api-frontend:${IMAGE_TAG}
    environment:
      - VITE_API_URL=${API_BASE_URL}
      - VITE_DISCORD_CLIENT_ID=${Discord__ClientId}
      - VITE_DISCORD_REDIRECT_URI=${Discord__RedirectUri}
      - VITE_APP_TITLE=${APP_NAME}
      - VITE_DOCS_URL=${DOCS_URL}
      - VITE_CONTACT_EMAIL=${CONTACT_EMAIL}
      - VITE_DISCORD_SERVER_URL=${Discord__ServerUrl}
      - VITE_STATUS_URL=${STATUS_URL}
      - VITE_GITHUB_URL=${GITHUB_URL}
      - VITE_TOS_URL=${DOCS_URL}/docs/terms-of-service
      - VITE_IMG_TRANSFORM_ENABLED=${IMG_TRANSFORM_ENABLED}
      - VITE_IMG_TRANSFORM_PATH=${IMG_TRANSFORM_PATH}
      - VITE_IMG_WIDTH_PARAM=${IMG_WIDTH_PARAM}
      - VITE_IMG_CARD_WIDTH=${IMG_CARD_WIDTH}
      - VITE_IMG_PREVIEW_WIDTH=${IMG_PREVIEW_WIDTH}
      - VITE_CDN_URL=${Cdn__BaseUrl}
    ports:
      - "127.0.0.1:${FRONTEND_PORT}:80"
    depends_on:
      - backend
    restart: always

  db:
    image: pgvector/pgvector:pg18
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: always
    # ports:
    #   - "${POSTGRES_PORT_EXTERNAL}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  storage:
    image: chrislusf/seaweedfs:latest
    command: >
      mini
      -dir=/data
      -ip.bind=0.0.0.0
      -s3.config=/etc/seaweedfs/s3.json
    environment:
      AWS_ACCESS_KEY_ID: ${S3__AccessKey}
      AWS_SECRET_ACCESS_KEY: ${S3__SecretKey}
      S3_BUCKET: ${S3__BucketName}
    volumes:
      - seaweedfs_data:/data
      - ./config/s3.json:/etc/seaweedfs/s3.json:ro
    ports:
      - "127.0.0.1:${SEAWEEDFS_PORT}:8333"
    restart: always

  docs:
    build:
      context: .
      dockerfile: docs/Dockerfile
      args:
        VERSION: ${IMAGE_TAG}
        DOCS_URL: ${DOCS_URL}
        DOCS_BASE_URL: ${DOCS_BASE_URL:-/}
        DOCS_ORG_NAME: ${DOCS_ORG_NAME}
        DOCS_PROJECT_NAME: ${DOCS_PROJECT_NAME}
        API_BASE_URL: ${API_BASE_URL}
        APP_NAME: ${APP_NAME}
        APP_TAGLINE: ${APP_TAGLINE}
        FRONTEND_URL: ${FRONTEND_URL}
        GITHUB_URL: ${GITHUB_URL}
    image: waifu-api-docs:${IMAGE_TAG}
    ports:
      - "127.0.0.1:${DOCS_PORT}:80"
    restart: unless-stopped

volumes:
  postgres_data:
  seaweedfs_data:
